name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: add extra programs for tests
      run: |
        sudo apt-get update
        sudo apt-get install emacs emacs-nox gdb screen tcsh zsh
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make tests
      run: make tests
    - name: make check
      run: make check AUTOTEST="--retry-once --jobs 8"

  macos-control-plane:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
    - name: configure control-plane build
      run: ./configure
    - name: build coordinator and command
      run: make -j2
    - name: verify unsupported runtime tools are not built
      run: |
        test -x bin/dmtcp_coordinator
        test -x bin/dmtcp_command
        test ! -e bin/dmtcp_launch
        test ! -e bin/dmtcp_restart
    - name: run control-plane tests
      run: make check-control
